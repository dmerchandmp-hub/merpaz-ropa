<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MERPAZ Ropa</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MERPAZ Ropa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: catálogo en cuadrícula de 2 columnas, fichas a pantalla completa, barra inferior fija */
:root{
  --ink:#111111; --ink2:#3a3a3a; --mu:#6e6e6e; --ln:#e2e1de; --bg:#f6f6f4; --sf:#ffffff;
  --gold:#8a6d3b; --ok:#1e7a46; --oks:#e5f3ea; --wa:#9a6200; --was:#fbf0dc; --er:#b42318; --ers:#fcebe9;
  --serif:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px; --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;font-family:var(--serif);font-weight:600;text-wrap:balance}
h2{font-size:1.5rem}
h3{font-size:1.1rem;margin:20px 0 8px}
small{color:var(--mu)}
.top{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top .tt{flex:1;min-width:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top img.lg{height:34px}
main{max-width:820px;margin:0 auto;padding:16px 16px calc(100px + var(--sb))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f{min-width:0}
.f.full{grid-column:1/-1}
.f label{display:block;font-size:.8rem;font-weight:650;margin:0 0 4px;letter-spacing:.02em}
.f small{display:block;margin-top:3px;font-size:.76rem}
.req{color:var(--er)}
input[type=text],input[type=tel],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--ln);border-radius:8px;background:#fff;padding:10px 11px;min-height:44px;font-size:16px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
.money{position:relative}.money span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mu)}.money input{padding-left:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;font-weight:650;padding:11px 16px;min-height:46px;cursor:pointer;text-decoration:none}
.btn.sec{background:#fff;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ln)}
.btn.danger{background:var(--ers);color:var(--er);border-color:var(--ers)}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.lnk{background:none;border:0;color:var(--ink);font-weight:650;padding:6px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lnk.danger{color:var(--er)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btns .btn{flex:1 1 140px}
.empty{color:var(--mu);font-size:.92rem}
.note{background:var(--was);color:#6b4300;border-radius:8px;padding:10px 12px;font-size:.9rem;margin:0 0 12px}
.info{background:#efeeeb;color:var(--ink2);border-radius:8px;padding:10px 12px;font-size:.88rem;margin:0 0 12px}
/* home */
.hero{background:var(--sf);border-bottom:1px solid var(--ln);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;display:flex;align-items:center;gap:14px}
.hero img{height:52px}
.hero .ht{flex:1;min-width:0}
.hero .ht b{display:block;font-family:var(--serif);font-size:1.25rem}
.hero .ht small{font-size:.8rem}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.kpis div{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:10px}
.kpis b{display:block;font-family:var(--serif);font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpis span{font-size:.72rem;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.filters{display:flex;gap:6px;overflow-x:auto;margin:10px 0 14px;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--ln);background:#fff;border-radius:20px;padding:6px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cat{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.cat{grid-template-columns:repeat(3,1fr)}}
.pc{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.pc .ph{aspect-ratio:4/5;background:#ecebe8;position:relative;overflow:hidden;max-width:100%}
.pc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pc .ph .bd{position:absolute;left:8px;top:8px}
.pc .bo{padding:9px 10px 11px;min-width:0}
.pc .nm{font-weight:650;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .pr{font-family:var(--serif);font-size:1.15rem;font-variant-numeric:tabular-nums}
.pc .pr s{font-family:var(--sans);font-size:.8rem;color:var(--mu);margin-left:4px}
.pc .st{font-size:.78rem;color:var(--mu)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;border-radius:4px;padding:3px 7px;letter-spacing:.04em;text-transform:uppercase}
.badge.ag{background:var(--ink);color:#fff}
.badge.lo{background:var(--was);color:var(--wa)}
.badge.of{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + var(--sb));z-index:7;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding:6px 8px calc(6px + var(--sb));z-index:6}
.tabs button{flex:1;background:none;border:0;padding:9px;font-size:.84rem;color:var(--mu);font-weight:650}
.tabs button.on{color:var(--ink);text-decoration:underline;text-underline-offset:5px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sf);border-top:1px solid var(--ln);display:flex;gap:10px;padding:10px 16px calc(10px + var(--sb))}
.nav .btn{flex:1}
/* fotos */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos .pt{position:relative;aspect-ratio:4/5;border-radius:8px;overflow:hidden;background:#ecebe8;max-width:100%}
.photos .pt img{width:100%;height:100%;object-fit:cover}
.photos .pt .x{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:15px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px}
.photos .pt .mk{position:absolute;left:4px;bottom:4px;border:0;border-radius:4px;background:rgba(255,255,255,.9);font-size:.7rem;font-weight:700;padding:3px 6px}
.photos .pt .mk.on{background:var(--ink);color:#fff}
.photos .add{aspect-ratio:4/5;border:1.5px dashed #bdbbb6;border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.82rem;font-weight:650;cursor:pointer;color:var(--ink2);max-width:100%}
.photos .add b{font-size:1.6rem;font-weight:400;line-height:1}
/* tallas */
.sets{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.sz{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #efeeeb;padding:8px 0}
.sz:first-child{border-top:0}
.sz b{min-width:44px}
.step{display:flex;align-items:center;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.step button{width:42px;height:40px;border:0;background:#f3f2ef;font-size:1.2rem;cursor:pointer}
.step input{width:56px;border:0;text-align:center;min-height:40px;padding:0;font-variant-numeric:tabular-nums;border-radius:0}
.sz .rm{color:var(--mu);font-size:.85rem}
.tot{display:flex;justify-content:space-between;font-weight:650;border-top:1px solid var(--ln);padding-top:10px;margin-top:4px}
.sw{display:flex;align-items:center;gap:10px;font-size:.92rem;margin-top:8px}
.sw input{width:22px;height:22px;accent-color:var(--ink)}
/* detalle */
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 82%;max-width:420px;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r);scroll-snap-align:center;background:#ecebe8}
.price{font-family:var(--serif);font-size:2rem;font-variant-numeric:tabular-nums}
.price s{font-family:var(--sans);font-size:1rem;color:var(--mu);margin-left:6px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.meta dt{color:var(--mu)}.meta dd{margin:0}
.stockrow{display:flex;align-items:center;gap:10px;border-top:1px solid #efeeeb;padding:9px 0}
.stockrow:first-child{border-top:0}
.stockrow b{min-width:44px}
.stockrow .n{flex:1;font-variant-numeric:tabular-nums}
.stockrow .n.zero{color:var(--er)}
.mini{border:1px solid var(--ln);background:#fff;border-radius:8px;padding:7px 11px;font-size:.84rem;font-weight:650;cursor:pointer}
.mini.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.sales{font-size:.88rem}
.sales div{display:flex;justify-content:space-between;border-top:1px solid #efeeeb;padding:6px 0;font-variant-numeric:tabular-nums}
/* publicar */
.fmt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.fmt button{border:1px solid var(--ln);background:#fff;border-radius:8px;padding:8px 4px;font-size:.84rem;font-weight:650}
.fmt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.prev{display:flex;justify-content:center;background:#e9e8e5;border-radius:var(--r);padding:12px;margin:0 0 12px}
.prev canvas{max-width:100%;max-height:62vh;height:auto;box-shadow:0 4px 18px rgba(0,0,0,.15);background:#fff}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px}
.thumbs img{width:56px;height:70px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer;flex:0 0 auto}
.thumbs img.on{border-color:var(--ink)}
.nets{font-size:.84rem;color:var(--mu);margin:6px 0 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,10,10,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center}}
.sheet{background:var(--sf);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px 16px calc(16px + var(--sb))}
@media(min-width:700px){.sheet{border-radius:14px}}
.toast{position:fixed;left:50%;bottom:calc(140px + var(--sb));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;font-size:.88rem;z-index:40;max-width:90vw;text-align:center}
.upd{background:var(--was);color:#6b4300;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.9rem}
.offl{text-align:center;font-size:.8rem;color:var(--mu);margin:18px 0 0}
.offl.ok{color:var(--ok)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
button:focus-visible,.chip:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>

<div id="upd"></div>
<div id="app"></div>
<div id="modal"></div>
<div id="dlg"></div>
<input type="file" id="inCam" accept="image/*" capture="environment" hidden>
<input type="file" id="inGal" accept="image/*" multiple hidden>
<input type="file" id="inJson" accept="application/json,.json" hidden>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const nowISO=()=>new Date().toISOString();
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
function money(v){return (cfg.moneda||'$')+num(v).toFixed(2)}
function fmtD(iso){const d=new Date(iso);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`}
function uid(){try{return crypto.randomUUID()}catch(e){return 'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2)}}
function toast(t,ms=2400){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}
function stockTotal(p){return (p.tallas||[]).reduce((s,t)=>s+(+t.stock||0),0)}
function descuento(p){const a=num(p.precioAntes),b=num(p.precio);return a>b&&b>0?Math.round((1-b/a)*100):0}
function ask(msg,{ok='Aceptar',cancel='Cancelar'}={}){return new Promise(res=>{const d=$('#dlg');d.innerHTML=`<div class="modal" style="z-index:50"><div class="sheet"><p style="margin:0 0 14px;white-space:pre-line">${esc(msg)}</p><div class="btns">${cancel?`<button class="btn ghost" id="dlgNo">${esc(cancel)}</button>`:''}<button class="btn" id="dlgOk">${esc(ok)}</button></div></div></div>`;const done=v=>{d.innerHTML='';res(v)};$('#dlgOk').onclick=()=>done(true);if(cancel)$('#dlgNo').onclick=()=>done(false)})}
const info=m=>ask(m,{cancel:null});

/* ================== INDEXEDDB ================== */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('merpaz-ropa',1);r.onupgradeneeded=()=>{r.result.createObjectStore('prod',{keyPath:'id'})};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 st(m){return this.db.transaction('prod',m).objectStore('prod')},
 req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 all(){return this.req(this.st('readonly').getAll())},put(o){return this.req(this.st('readwrite').put(o))},del(id){return this.req(this.st('readwrite').delete(id))}};

async function load(){productos=(await DB.all()).sort((a,b)=>(b.actualizado||'').localeCompare(a.actualizado||''))}
async function save(p){p.actualizado=nowISO();await DB.put(p);const i=productos.findIndex(x=>x.id===p.id);if(i<0)productos.unshift(p);else productos[i]=p;productos.sort((a,b)=>(b.actualizado||'').localeCompare(a.actualizado||''))}
function sku(cat){const pre=(cat||'PRD').normalize('NFD').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'PRD';return `${pre}-${Math.random().toString(36).slice(2,6).toUpperCase()}`}

/* ================== IMÁGENES ================== */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('No se pudo leer la imagen'));i.src=src})}
async function procImg(file){const url=URL.createObjectURL(file);try{const img=await loadImg(url);const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);return {data:c.toDataURL('image/jpeg',.82),w,h}}finally{URL.revokeObjectURL(url)}}

function wrap(ctx,text,maxW,maxLines){const words=String(text||'').split(/\s+/);const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;if(lines.length===maxLines)break}else cur=t}if(lines.length<maxLines&&cur)lines.push(cur);if(lines.length===maxLines&&words.join(' ').length>lines.join(' ').length){let l=lines[maxLines-1];while(ctx.measureText(l+'…').width>maxW&&l.length)l=l.slice(0,-1);lines[maxLines-1]=l+'…'}return lines}
function cover(ctx,img,x,y,w,h){const r=Math.max(w/img.naturalWidth,h/img.naturalHeight);const sw=w/r,sh=h/r;const sx=(img.naturalWidth-sw)/2,sy=Math.max(0,(img.naturalHeight-sh)*0.35);ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h)}
function tallasDisp(p){return p.tallas.filter(t=>+t.stock>0).map(t=>t.t)}
async function drawPost(){const p=P(view.id);const cv=$('#cv');if(!p||!cv)return;const F=FORMATOS[pub.fmt];cv.width=F.w;cv.height=F.h;const x=cv.getContext('2d');
 const SER='Didot, "Bodoni 72", "Bodoni MT", Georgia, serif',SAN='-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
 x.fillStyle='#fff';x.fillRect(0,0,F.w,F.h);
 const band=pub.fmt==='story'?470:pub.fmt==='post'?300:0;const ph=F.h-band;
 const f=p.fotos[pub.foto]||p.fotos[0];
 if(f){cover(x,await loadImg(f.data),0,0,F.w,ph)}else{x.fillStyle='#ecebe8';x.fillRect(0,0,F.w,ph)}
 // sello con logo
 const lg=await loadImg(LOGO);const lw=230,lh=lw*lg.naturalHeight/lg.naturalWidth;x.fillStyle='rgba(255,255,255,.94)';x.fillRect(40,40,lw+28,lh+28);x.drawImage(lg,54,54,lw,lh);
 const d=descuento(p),st=stockTotal(p);
 if(d&&st){x.fillStyle='#111';x.beginPath();x.arc(F.w-120,120,82,0,7);x.fill();x.fillStyle='#fff';x.textAlign='center';x.font=`600 52px ${SER}`;x.fillText(`-${d}%`,F.w-120,138);x.textAlign='left'}
 if(!st){x.save();x.translate(F.w/2,ph/2);x.rotate(-0.18);x.fillStyle='rgba(17,17,17,.88)';x.fillRect(-F.w,-60,F.w*2,120);x.fillStyle='#fff';x.textAlign='center';x.font=`600 64px ${SER}`;x.fillText('AGOTADO',0,22);x.restore();x.textAlign='left'}
 let y0;
 if(band){x.fillStyle='#111';x.fillRect(0,ph,F.w,band);y0=ph+70}
 else{const g=x.createLinearGradient(0,F.h-430,0,F.h);g.addColorStop(0,'rgba(17,17,17,0)');g.addColorStop(.55,'rgba(17,17,17,.82)');g.addColorStop(1,'rgba(17,17,17,.95)');x.fillStyle=g;x.fillRect(0,F.h-430,F.w,430);y0=F.h-250}
 // precio a la derecha
 x.textAlign='right';x.fillStyle='#fff';x.font=`600 96px ${SER}`;const pr=money(p.precio);x.fillText(pr,F.w-56,y0+40);const prW=x.measureText(pr).width;
 x.font=`400 32px ${SAN}`;x.fillStyle='#cfcfcf';
 let yR=y0+90;if(d){x.save();x.fillText(`Antes ${money(p.precioAntes)}`,F.w-56,yR);const tw=x.measureText(`Antes ${money(p.precioAntes)}`).width;x.strokeStyle='#cfcfcf';x.lineWidth=2;x.beginPath();x.moveTo(F.w-56-x.measureText(money(p.precioAntes)).width,yR-10);x.lineTo(F.w-56,yR-10);x.stroke();x.restore();yR+=46}
 x.fillStyle='#fff';x.fillText(p.envioGratis?'Envío gratis':`Envío ${money(p.envio)}`,F.w-56,yR);
 // nombre y tallas a la izquierda
 x.textAlign='left';const maxW=F.w-56-56-Math.max(prW,330)-30;
 x.fillStyle='#fff';x.font=`600 52px ${SER}`;const ls=wrap(x,p.nombre,maxW,2);ls.forEach((l,i)=>x.fillText(l,56,y0+i*60));
 let yL=y0+ls.length*60+14;x.font=`400 30px ${SAN}`;x.fillStyle='#cfcfcf';
 const td=tallasDisp(p);if(td.length){const t='Tallas: '+td.join(' · ');wrap(x,t,maxW,2).forEach(l=>{x.fillText(l,56,yL);yL+=40})}
 if(p.colores){wrap(x,p.colores,maxW,1).forEach(l=>{x.fillText(l,56,yL);yL+=40})}
 if(pub.fmt==='story'){x.fillStyle='#fff';x.font=`600 34px ${SAN}`;x.textAlign='center';x.fillText(cfg.whatsapp?`Pedidos por WhatsApp ${cfg.whatsapp}`:`Pedidos por mensaje directo`,F.w/2,F.h-70);x.textAlign='left';x.fillStyle='#555';x.fillRect(56,F.h-130,F.w-112,1)}
 pub.blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.9));pub.file=new File([pub.blob],fileBase(p)+'.jpg',{type:'image/jpeg'})}
function fileBase(p){return ('MERPAZ_'+(p.nombre||p.sku)).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').slice(0,50)+'_'+pub.fmt}
function genTexto(p){const td=tallasDisp(p);const d=descuento(p);const st=stockTotal(p);
 return [`${p.nombre}${st?'':' (AGOTADO)'}`,'',p.caracteristicas||'',p.material?`Material: ${p.material}`:'',p.colores?`Colores: ${p.colores}`:'',td.length?`Tallas disponibles: ${td.join(', ')}`:'','',
  d?`Precio: ${money(p.precio)} (antes ${money(p.precioAntes)}, ${d}% de descuento)`:`Precio: ${money(p.precio)}`,p.envioGratis?'Envío gratis':`Envío: ${money(p.envio)}`,'',
  cfg.whatsapp?`Pedidos por WhatsApp: ${cfg.whatsapp}`:'Pedidos por mensaje directo',cfg.ciudad?`Entregas desde ${cfg.ciudad}`:'','',cfg.hashtags||''].filter((l,i,a)=>!(l===''&&a[i-1]==='')).join('\n').replace(/\n{3,}/g,'\n\n').trim()}
function copyText(t){try{const pr=navigator.clipboard&&navigator.clipboard.writeText(t);if(pr&&pr.catch)pr.catch(()=>{});return !!pr}catch(e){return false}}
let DL=null;try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
async function saveFile(blob,name){if(DL){try{await DL.save({filename:name,data:blob});return}catch(e){if(e&&e.code==='declined')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

/* ================== EVENTOS ================== */
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){busca=t.value;const c=document.querySelector('.cat');const pos=t.selectionStart;render(true);const q=$('#q');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}return}
 if(t.dataset.cfg){cfg[t.dataset.cfg]=t.value;saveCfg();return}
 if(t.dataset.d&&draft){draft[t.dataset.d]=t.value;return}
 if(t.dataset.st&&draft){draft.tallas[+t.dataset.st].stock=Math.max(0,parseInt(t.value)||0);$('#stTot').textContent=stockTotal(draft)+' unidades';return}
 if(t.id==='txt'){pub.texto=t.value}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='envioGratis'&&draft){draft.envioGratis=t.checked;render(true)}else if(t.dataset.d&&draft){draft[t.dataset.d]=t.value}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act;e.preventDefault();
 try{switch(a){
 case 'tab':view={name:el.dataset.v};return render();
 case 'filtro':filtro=el.dataset.v;return render(true);
 case 'new':draft=nuevo();view={name:'edit',isNew:true};return render();
 case 'edit':draft=JSON.parse(JSON.stringify(P(el.dataset.id)));view={name:'edit',id:draft.id};return render();
 case 'det':view={name:'det',id:el.dataset.id};return render();
 case 'cancel':{const back=view.id?{name:'det',id:view.id}:{name:'home'};draft=null;view=back;return render()}
 case 'cam':return $('#inCam').click();
 case 'gal':return $('#inGal').click();
 case 'fdel':draft.fotos.splice(+el.dataset.i,1);return render(true);
 case 'fmain':{const [f]=draft.fotos.splice(+el.dataset.i,1);draft.fotos.unshift(f);return render(true)}
 case 'set':{const k=el.dataset.v;const old=Object.fromEntries(draft.tallas.map(t=>[t.t,t.stock]));draft.set=k;draft.tallas=SETS[k].map(t=>({t,stock:old[t]||0}));return render(true)}
 case 'st+':case 'st-':{const t=draft.tallas[+el.dataset.i];t.stock=Math.max(0,(+t.stock||0)+(a==='st+'?1:-1));const inp=document.querySelector(`[data-st="${el.dataset.i}"]`);inp.value=t.stock;$('#stTot').textContent=stockTotal(draft)+' unidades';return}
 case 'tdel':draft.tallas.splice(+el.dataset.i,1);return render(true);
 case 'tadd':{const v=$('#newSz').value.trim().toUpperCase();if(!v)return;if(draft.tallas.some(t=>t.t===v))return toast('Esa talla ya está');draft.tallas.push({t:v,stock:0});return render(true)}
 case 'save':{const d=draft;if(!d.nombre.trim())return info('Escriba el nombre de la prenda.');if(!(num(d.precio)>0))return info('Escriba el precio de venta.');if(!d.fotos.length&&!await ask('El producto no tiene fotos. ¿Guardar de todos modos?',{ok:'Guardar'}))return;
   d.precio=num(d.precio).toFixed(2);d.precioAntes=d.precioAntes?num(d.precioAntes).toFixed(2):'';d.envio=num(d.envio).toFixed(2);if(!d.sku)d.sku=sku(d.categoria);await save(d);draft=null;view={name:'det',id:d.id};render();return toast('Producto guardado')}
 case 'repo':{const p=P(view.id);p.tallas[+el.dataset.i].stock=(+p.tallas[+el.dataset.i].stock||0)+1;await save(p);return render(true)}
 case 'sell':{const p=P(view.id);const t=p.tallas[+el.dataset.i];if(!(+t.stock))return;t.stock=+t.stock-1;(p.ventas=p.ventas||[]).push({fecha:nowISO(),talla:t.t,precio:p.precio,cant:1});await save(p);render(true);return toast(`Venta registrada: talla ${t.t}. Quedan ${t.stock}.`)}
 case 'dup':{const p=JSON.parse(JSON.stringify(P(el.dataset.id)));p.id=uid();p.sku=sku(p.categoria);p.nombre+=' (copia)';p.ventas=[];p.creado=nowISO();p.tallas.forEach(t=>t.stock=0);draft=p;view={name:'edit',isNew:true};render();return toast('Copia creada: ajuste stock y guarde')}
 case 'del':{const p=P(el.dataset.id);if(!await ask(`¿Eliminar “${p.nombre}”? No se puede deshacer.`,{ok:'Eliminar'}))return;await DB.del(p.id);productos=productos.filter(x=>x.id!==p.id);view={name:'home'};return render()}
 case 'pub':{const p=P(el.dataset.id);pub={fmt:pub.fmt||'post',foto:0,blob:null,file:null,texto:genTexto(p)};view={name:'pub',id:p.id};return render()}
 case 'fmt':pub.fmt=el.dataset.v;document.querySelectorAll('.fmt button').forEach(b=>b.classList.toggle('on',b.dataset.v===pub.fmt));return drawPost();
 case 'pfoto':pub.foto=+el.dataset.i;document.querySelectorAll('.thumbs img').forEach((b,i)=>b.classList.toggle('on',i===pub.foto));return drawPost();
 case 'copy':{copyText(pub.texto)?toast('Texto copiado'):($('#txt').select(),toast('Seleccione y copie el texto'));return}
 case 'share':{if(!pub.file)return toast('Preparando imagen…');copyText(pub.texto);
   if(navigator.canShare&&navigator.canShare({files:[pub.file]})){try{await navigator.share({files:[pub.file],text:pub.texto,title:P(view.id).nombre});toast('Pegue el texto en la descripción',3000)}catch(err){if(err.name!=='AbortError')toast('No se pudo compartir; use Guardar imagen',3500)}}
   else{await saveFile(pub.blob,pub.file.name);toast('Imagen lista y texto copiado. Súbala desde la app de la red social.',4000)}return}
 case 'shareAll':{const p=P(view.id);const files=[pub.file,...p.fotos.map((f,i)=>{const b=atob(f.data.split(',')[1]);const u=new Uint8Array(b.length);for(let j=0;j<b.length;j++)u[j]=b.charCodeAt(j);return new File([u],`${fileBase(p)}_foto${i+1}.jpg`,{type:'image/jpeg'})})].filter(Boolean);copyText(pub.texto);
   if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files,text:pub.texto})}catch(err){if(err.name!=='AbortError')toast('No se pudo compartir',3000)}}else toast('Este navegador no permite compartir varias fotos',3500);return}
 case 'dlimg':if(pub.blob)await saveFile(pub.blob,pub.file.name);return;
 case 'export':{const blob=new Blob([JSON.stringify({app:'merpaz-ropa',version:1,exportado:nowISO(),productos})],{type:'application/json'});const d=new Date();await saveFile(blob,`Respaldo_MERPAZ_Ropa_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`);return}
 case 'import':return $('#inJson').click();
 }}catch(err){console.error(err);info('Error: '+err.message)}});

async function addFotos(files){if(!draft)return;let n=0;for(const f of files){if(draft.fotos.length>=6){toast('Máximo 6 fotos');break}if(!f.type.startsWith('image/'))continue;try{draft.fotos.push(await procImg(f));n++}catch(e){toast(e.message)}}if(n)render(true)}
$('#inCam').onchange=$('#inGal').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(fs.length){toast('Procesando…',1000);await addFotos(fs)}};
$('#inJson').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='merpaz-ropa'||!Array.isArray(j.productos))throw new Error('El archivo no es un respaldo de esta app');let n=0,u=0;for(const p of j.productos){const ex=P(p.id);if(!ex){await DB.put(p);n++}else if((p.actualizado||'')>(ex.actualizado||'')){await DB.put(p);u++}}await load();render();info(`Importación terminada.\nNuevos: ${n}\nActualizados: ${u}`)}catch(err){info('No se pudo importar: '+err.message)}};

/* ================== SERVICE WORKER ================== */
let offlineReady=false;
function updOffline(){const el=$('#offl');if(!el)return;if(!/^https?:/.test(location.protocol)){el.textContent='';return}el.className='offl'+(offlineReady?' ok':'');el.textContent=offlineReady?'Lista para usar sin conexión':'Preparando uso sin conexión…'}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
 navigator.serviceWorker.register('sw.js').then(reg=>{navigator.serviceWorker.ready.then(()=>{offlineReady=true;updOffline()});
  const showUpd=w=>{$('#upd').innerHTML=`<div class="upd"><span>Nueva versión disponible</span><button class="btn" style="min-height:36px;padding:6px 12px" id="updBtn">Actualizar</button></div>`;$('#updBtn').onclick=()=>w.postMessage('skip')};
  if(reg.waiting&&navigator.serviceWorker.controller)showUpd(reg.waiting);
  reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpd(w)})})}).catch(()=>{});
 let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl){rl=true;location.reload()}});
}
(async()=>{try{await DB.open();if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});await load();render()}catch(e){$('#app').innerHTML=`<main><div class="note">No se pudo abrir el almacenamiento del teléfono: ${esc(e.message)}</div></main>`}})();
</script>
</body>
</html>
